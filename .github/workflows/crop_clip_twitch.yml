name: Crop Clip (Twitch)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
      vod_url:
        description: "Twitch VOD URL"
        required: true
      start_time:
        description: "Start time (HH:MM:SS)"
        required: false
        default: ""
      end_time:
        description: "End time (HH:MM:SS)"
        required: false
        default: ""
      clip_index:
        description: "Clip index (0-4)"
        required: false
        default: "0"
      video_id:
        description: "Video ID"
        required: false
        default: ""

      # Layout & Camera Options
      crop_mode:
        description: "Crop Mode (full_streamer, center_crop, split_webcam_game, blur_fill)"
        required: false
        default: "full_streamer"
      cam_location:
        description: "Camera Location (auto, top_left, top_right, bottom_left, bottom_right)"
        required: false
        default: "auto"

      # Subtitle Typography & Styling
      font_family:
        description: "Font Family"
        required: false
        default: "Montserrat-ExtraBold"
      font_size:
        description: "Font Size"
        required: false
        default: "28"
      primary_color:
        description: "Primary Text Color"
        required: false
        default: "#FFFFFF"
      highlight_color:
        description: "Highlight Text Color"
        required: false
        default: "#FFE600"
      stroke_color:
        description: "Text Stroke Color"
        required: false
        default: "#000000"
      caption_animation:
        description: "Subtitle Animation (bouncing_word, pop_in)"
        required: false
        default: "bouncing_word"

      # Overlays & Badges
      render_chat:
        description: "Render Twitch Chat (true/false)"
        required: false
        default: "true"
      chat_position:
        description: "Chat Position (bottom_right, bottom_left, top_right)"
        required: false
        default: "bottom_right"
      chat_opacity:
        description: "Chat Opacity Percentage"
        required: false
        default: "80"
      show_streamer_badge:
        description: "Show Streamer Badge (true/false)"
        required: false
        default: "true"
      show_progress_bar:
        description: "Show Progress Bar (true/false)"
        required: false
        default: "true"

jobs:
  crop-clip-twitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Write YouTube cookies
        run: |
          cat > cookies.txt << 'EOF'
          ${{ secrets.YT_COOKIES }}
          EOF

      - name: Crop to vertical
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          CLIP_INDEX: ${{ github.event.inputs.clip_index }}
          START_TIME: ${{ github.event.inputs.start_time }}
          END_TIME: ${{ github.event.inputs.end_time }}
          VOD_URL: ${{ github.event.inputs.vod_url }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          CROP_MODE: ${{ github.event.inputs.crop_mode }}
          CAM_LOCATION: ${{ github.event.inputs.cam_location }}
          FONT_FAMILY: ${{ github.event.inputs.font_family }}
          FONT_SIZE: ${{ github.event.inputs.font_size }}
          PRIMARY_COLOR: ${{ github.event.inputs.primary_color }}
          HIGHLIGHT_COLOR: ${{ github.event.inputs.highlight_color }}
          STROKE_COLOR: ${{ github.event.inputs.stroke_color }}
          CAPTION_ANIMATION: ${{ github.event.inputs.caption_animation }}
          RENDER_CHAT: ${{ github.event.inputs.render_chat }}
          CHAT_POSITION: ${{ github.event.inputs.chat_position }}
          CHAT_OPACITY: ${{ github.event.inputs.chat_opacity }}
          SHOW_STREAMER_BADGE: ${{ github.event.inputs.show_streamer_badge }}
          SHOW_PROGRESS_BAR: ${{ github.event.inputs.show_progress_bar }}
        run: |
          python scripts/crop_clip_twitch.py \
            --job-id "$JOB_ID" \
            --clip-index "$CLIP_INDEX" \
            --start "$START_TIME" \
            --end "$END_TIME" \
            --vod-url "$VOD_URL"
