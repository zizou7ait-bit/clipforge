name: Find Clips (Twitch)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'Twitch VOD URL'
        required: true
        type: string
      job_id:
        description: 'Job ID'
        required: true
        type: string

jobs:
  run-clip-finder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp boto3 requests

      - name: Run script
        env:
          TWITCH_URL: ${{ github.event.inputs.vod_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/find_clips_twitch.py
