name: Find Clips (Twitch)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "Twitch VOD URL to analyze"
        required: true
      job_id:
        description: "Job ID from dashboard"
        required: true

jobs:
  find-clips-twitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Find clips from chat activity
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          TWITCH_URL: ${{ github.event.inputs.vod_url }}
        run: |
          python scripts/find_clips_twitch.py "$TWITCH_URL" "$JOB_ID"
