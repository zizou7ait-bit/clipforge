name: TikTok Style

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      r2_public_url:
        description: 'R2 Public URL (e.g. https://pub-xxxx.r2.dev)'
        required: true
      vod_url:
        description: 'Twitch VOD URL'
        required: true
      clip_index:
        description: 'Clip index'
        required: true
      start:
        description: 'Clip start time (HH:MM:SS)'
        required: true
      end:
        description: 'Clip end time (HH:MM:SS)'
        required: true
      layout_mode:
        description: 'Video layout'
        required: false
        default: 'crop'
        type: choice
        options:
          - crop
          - blur_bg
      font_size:
        description: 'Caption font size'
        required: false
        default: '85'
      primary_color:
        description: 'Primary caption color (hex, e.g. #FFFFFF)'
        required: false
        default: '#FFFFFF'
      highlight_color:
        description: 'Highlight/spoken-word caption color (hex, e.g. #00FFFF)'
        required: false
        default: '#00FFFF'
      margin_v:
        description: 'Vertical caption margin (px from bottom edge)'
        required: false
        default: '150'

env:
  PYTHON_VERSION: '3.11'

jobs:
  style-tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core yt-dlp
          pip install openai-whisper pillow numpy boto3 urllib3

      - name: Set job env vars
        run: |
          echo "JOB_ID=${{ github.event.inputs.job_id }}" >> $GITHUB_ENV
          echo "LAYOUT_MODE=${{ github.event.inputs.layout_mode }}" >> $GITHUB_ENV
          echo "FONT_SIZE=${{ github.event.inputs.font_size }}" >> $GITHUB_ENV
          echo "PRIMARY_COLOR=${{ github.event.inputs.primary_color }}" >> $GITHUB_ENV
          echo "HIGHLIGHT_COLOR=${{ github.event.inputs.highlight_color }}" >> $GITHUB_ENV
          echo "MARGIN_V=${{ github.event.inputs.margin_v }}" >> $GITHUB_ENV

      # NOTE: this step calls crop_clip_twitch.py directly so layout_mode can
      # reach it. If cropping already happens in a separate upstream workflow
      # in your pipeline, drop this step and keep the R2 download instead.
      - name: Crop & lay out clip
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python scripts/crop_clip_twitch.py \
            --job-id "${{ github.event.inputs.job_id }}" \
            --clip-index "${{ github.event.inputs.clip_index }}" \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --vod-url "${{ github.event.inputs.vod_url }}" \
            --layout "${{ github.event.inputs.layout_mode }}"

      - name: Download final.mp4 from R2 public URL
        run: |
          FILE_PATH="/jobs/${JOB_ID}/final.mp4"
          echo "Downloading: ${{ github.event.inputs.r2_public_url }}${FILE_PATH}"
          wget -q -O final.mp4 "${{ github.event.inputs.r2_public_url }}${FILE_PATH}" || {
            echo "ERROR: Download failed"
            exit 1
          }
          ls -lh final.mp4

      - name: Transcribe with Whisper
        run: |
          whisper ./final.mp4 --model tiny --language en --word_timestamps True --output_format json --output_dir ./
          mv final.json transcription.json

      - name: Generate TikTok ASS captions
        env:
          FONT_SIZE: ${{ github.event.inputs.font_size }}
          PRIMARY_COLOR: ${{ github.event.inputs.primary_color }}
          HIGHLIGHT_COLOR: ${{ github.event.inputs.highlight_color }}
          MARGIN_V: ${{ github.event.inputs.margin_v }}
        run: |
          cat > generate_captions.py << 'PYEOF'
          import json
          import os

          def hex_to_ass(hex_color: str) -> str:
              """Convert a #RRGGBB (or #RGB) hex string to ASS &H00BBGGRR format."""
              h = hex_color.strip().lstrip('#')
              if len(h) == 3:
                  h = ''.join(c * 2 for c in h)
              if len(h) != 6:
                  raise ValueError(f"Invalid hex color: {hex_color}")
              r, g, b = h[0:2], h[2:4], h[4:6]
              return f"&H00{b.upper()}{g.upper()}{r.upper()}"

          STYLE = {
              'font': 'DejaVu Sans',
              'fontsize': os.environ.get('FONT_SIZE', '85'),
              'primary_color': hex_to_ass(os.environ.get('PRIMARY_COLOR', '#FFFFFF')),
              'outline_color': '&H00000000',
              'highlight_color': hex_to_ass(os.environ.get('HIGHLIGHT_COLOR', '#00FFFF')),
              'outline': 3,
              'shadow': 0,
              'margin_v': os.environ.get('MARGIN_V', '150'),
          }

          def ms_to_ass(time_ms):
              hours = int(time_ms // 3600000)
              minutes = int((time_ms % 3600000) // 60000)
              seconds = int((time_ms % 60000) // 1000)
              centis = int((time_ms % 1000) // 10)
              return f"{hours}:{minutes:02d}:{seconds:02d}.{centis:02d}"

          def escape_ass(text):
              return text.replace('\\', '\\\\').replace('{', '\\{').replace('}', '\\}')

          with open('transcription.json', 'r') as f:
              data = json.load(f)

          lines = []
          lines.append("[Script Info]")
          lines.append("Title: TikTok Captions")
          lines.append("ScriptType: v4.00+")
          lines.append("PlayResX: 1080")
          lines.append("PlayResY: 1920")
          lines.append("")
          lines.append("[V4+ Styles]")
          lines.append("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding")
          lines.append(f"Style: TikTok,{STYLE['font']},{STYLE['fontsize']},{STYLE['primary_color']},{STYLE['highlight_color']},{STYLE['outline_color']},&H00000000,1,0,0,0,100,100,0,0,1,{STYLE['outline']},{STYLE['shadow']},2,40,40,{STYLE['margin_v']},1")
          lines.append("")
          lines.append("[Events]")
          lines.append("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text")

          words = []
          for seg in data.get('segments', []):
              for w in seg.get('words', []):
                  word_text = w.get('word', '').strip()
                  if word_text:
                      words.append({
                          'word': word_text,
                          'start': w['start'] * 1000,
                          'end': w['end'] * 1000
                      })

          chunk_size = 4
          for i in range(0, len(words), chunk_size):
              chunk = words[i:i+chunk_size]
              if not chunk:
                  continue
              line_start = chunk[0]['start']
              line_end = chunk[-1]['end']
              text_parts = []
              for w in chunk:
                  duration_ms = w['end'] - w['start']
                  centis = max(1, int(duration_ms / 10))
                  escaped = escape_ass(w['word'])
                  text_parts.append(f"{{\\k{centis}}}{escaped}")
              text = " ".join(text_parts)
              lines.append(f"Dialogue: 0,{ms_to_ass(line_start)},{ms_to_ass(line_end)},TikTok,,0,0,0,,{text}")

          with open('tiktok_captions.ass', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          print(f"Generated captions with {len(words)} words")
          PYEOF
          python generate_captions.py

      - name: Render TikTok video
        run: |
          ffmpeg -y \
            -i final.mp4 \
            -vf "subtitles=tiktok_captions.ass" \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11,acompressor=threshold=-20dB:ratio=4:attack=5:release=100" \
            -c:v libx264 -preset fast -crf 23 \
            -c:a aac -b:a 192k \
            -movflags +faststart -pix_fmt yuv420p \
            tiktok.mp4
          ls -lh tiktok.mp4

      - name: Upload tiktok.mp4 to Cloudflare R2 (via Worker)
        env:
          R2_UPLOAD_SECRET: ${{ secrets.R2_UPLOAD_SECRET }}
        run: |
          WORKER_URL="https://clipforge-uploader.zizou7ait.workers.dev"
          R2_KEY="jobs/${JOB_ID}/tiktok.mp4"

          echo "=== DEBUG: Upload step starting ==="
          echo "Worker URL: ${WORKER_URL}"
          echo "R2 Key: ${R2_KEY}"
          echo "JOB_ID env var: ${JOB_ID}"
          echo "Secret is set: $([ -n "$R2_UPLOAD_SECRET" ] && echo yes || echo NO -- MISSING)"

          echo "=== DEBUG: Checking local file ==="
          if [ ! -f tiktok.mp4 ]; then
            echo "ERROR: tiktok.mp4 not found in working directory!"
            ls -la
            exit 1
          fi
          ls -lh tiktok.mp4
          FILE_SIZE=$(stat -c%s tiktok.mp4 2>/dev/null || stat -f%z tiktok.mp4)
          echo "File size (bytes): ${FILE_SIZE}"

          echo "=== DEBUG: Sending request (verbose) ==="
          HTTP_STATUS=$(curl -v -s -o response.txt -w "%{http_code}" \
            -X POST "${WORKER_URL}" \
            -H "X-Upload-Secret: ${R2_UPLOAD_SECRET}" \
            -H "X-R2-Key: ${R2_KEY}" \
            -H "Content-Type: video/mp4" \
            --data-binary @tiktok.mp4 2> curl_verbose.log)

          echo "=== DEBUG: curl verbose log ==="
          cat curl_verbose.log

          echo "=== DEBUG: Response body ==="
          cat response.txt
          echo ""
          echo "=== DEBUG: HTTP status: ${HTTP_STATUS} ==="

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "ERROR: Upload failed with status ${HTTP_STATUS}"
            exit 1
          fi

          echo "=== SUCCESS: Upload complete ==="

      - name: Cleanup
        if: always()
        run: rm -f final.mp4 tiktok.mp4 transcription.json tiktok_captions.ass generate_captions.py curl_verbose.log response.txt
