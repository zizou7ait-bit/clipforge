name: TikTok Style

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      r2_bucket:
        description: 'R2 Bucket Name'
        required: true
      r2_endpoint:
        description: 'R2 Endpoint URL'
        required: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  style-tiktok:
    runs-on: ubuntu-latest
    steps:
      # ─── CHECKOUT & SETUP ───
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install FFmpeg & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install openai-whisper pillow numpy boto3 urllib3
          
      # ─── DOWNLOAD FINAL VIDEO FROM R2 ───
      - name: Download final.mp4 from R2
        run: |
          ENDPOINT="${{ github.event.inputs.r2_endpoint }}"
          ACCOUNT_ID=$(echo "$ENDPOINT" | sed 's|https://||' | sed 's|\.r2\.cloudflarestorage\.com||')
          
          PUBLIC_URL="https://pub-${ACCOUNT_ID}.r2.dev"
          FILE_PATH="/jobs/${{ github.event.inputs.job_id }}/final.mp4"
          
          echo "Downloading from: ${PUBLIC_URL}${FILE_PATH}"
          wget -q -O final.mp4 "${PUBLIC_URL}${FILE_PATH}" || {
            echo "ERROR: Failed to download final.mp4"
            exit 1
          }
          
          ls -lh final.mp4
          echo "Download complete!"
          
      # ─── TRANSCRIBE WITH WHISPER ───
      - name: Transcribe audio with Whisper
        run: |
          whisper ./final.mp4 --model tiny --language en --word_timestamps True --output_format json --output_dir ./
          mv final.json transcription.json
          
      # ─── GENERATE TIKTOK CAPTIONS ───
      - name: Generate TikTok-style ASS captions
        run: |
          cat > generate_captions.py << 'PYEOF'
          import json

          STYLE = {
              'font': 'DejaVu Sans',
              'fontsize': 48,
              'primary_color': '&H00FFFFFF',
              'outline_color': '&H00000000',
              'highlight_color': '&H0000FF88',
              'outline': 3,
              'shadow': 0,
              'margin_v': 150
          }

          def ms_to_ass(time_ms):
              hours = int(time_ms // 3600000)
              minutes = int((time_ms % 3600000) // 60000)
              seconds = int((time_ms % 60000) // 1000)
              centis = int((time_ms % 1000) // 10)
              return f"{hours}:{minutes:02d}:{seconds:02d}.{centis:02d}"

          def escape_ass(text):
              return text.replace('\\', '\\\\').replace('{', '\\{').replace('}', '\\}')

          with open('transcription.json', 'r') as f:
              data = json.load(f)

          lines = []
          lines.append("[Script Info]")
          lines.append("Title: TikTok Captions")
          lines.append("ScriptType: v4.00+")
          lines.append("PlayResX: 1080")
          lines.append("PlayResY: 1920")
          lines.append("")
          lines.append("[V4+ Styles]")
          lines.append("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding")
          lines.append(f"Style: TikTok,{STYLE['font']},{STYLE['fontsize']},{STYLE['primary_color']},{STYLE['highlight_color']},{STYLE['outline_color']},&H00000000,1,0,0,0,100,100,0,0,1,{STYLE['outline']},{STYLE['shadow']},2,40,40,{STYLE['margin_v']},1")
          lines.append("")
          lines.append("[Events]")
          lines.append("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text")

          words = []
          for seg in data.get('segments', []):
              for w in seg.get('words', []):
                  word_text = w.get('word', '').strip()
                  if word_text:
                      words.append({
                          'word': word_text,
                          'start': w['start'] * 1000,
                          'end': w['end'] * 1000
                      })

          chunk_size = 4
          for i in range(0, len(words), chunk_size):
              chunk = words[i:i+chunk_size]
              if not chunk:
                  continue
              
              line_start = chunk[0]['start']
              line_end = chunk[-1]['end']
              
              text_parts = []
              for w in chunk:
                  duration_ms = w['end'] - w['start']
                  centis = max(1, int(duration_ms / 10))
                  escaped = escape_ass(w['word'])
                  text_parts.append(f"{{\\k{centis}}}{escaped}")
              
              text = " ".join(text_parts)
              lines.append(f"Dialogue: 0,{ms_to_ass(line_start)},{ms_to_ass(line_end)},TikTok,,0,0,0,,{text}")

          with open('tiktok_captions.ass', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
              
          print(f"Generated captions with {len(words)} words")
          PYEOF
          python generate_captions.py

      # ─── RENDER TIKTOK VIDEO ───
      - name: Render TikTok video with effects
        run: |
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 final.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 final.mp4)
          echo "Input dimensions: ${WIDTH}x${HEIGHT}"
          
          ffmpeg -y \
            -i final.mp4 \
            -vf "subtitles=tiktok_captions.ass:force_style='FontSize=48,Outline=3,Shadow=0,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Bold=1'" \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11,acompressor=threshold=-20dB:ratio=4:attack=5:release=100" \
            -c:v libx264 \
            -preset fast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            tiktok.mp4
          
          echo "TikTok video rendered successfully!"
          ls -lh tiktok.mp4

      # ─── UPLOAD TO R2 (using Python boto3 with SSL disabled) ───
      - name: Upload tiktok.mp4 to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ github.event.inputs.r2_bucket }}
          R2_ENDPOINT: ${{ github.event.inputs.r2_endpoint }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          cat > upload_to_r2.py << 'PYEOF'
          import boto3
          import os
          import urllib3
          from botocore.client import Config
          
          # Disable SSL warnings
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          
          bucket = os.environ['R2_BUCKET']
          endpoint = os.environ['R2_ENDPOINT']
          access_key = os.environ['R2_ACCESS_KEY']
          secret_key = os.environ['R2_SECRET_KEY']
          job_id = os.environ['JOB_ID']
          
          # Create S3 client with SSL verification disabled
          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              config=Config(
                  signature_version='s3v4',
                  s3={'addressing_style': 'path'},
                  connect_timeout=30,
                  read_timeout=30
              ),
              verify=False,
              use_ssl=True
          )
          
          # Set addressing style to path-based (bucket in path, not subdomain)
          # This matches how R2 works
          key = f"jobs/{job_id}/tiktok.mp4"
          
          print(f"Uploading to bucket: {bucket}")
          print(f"Key: {key}")
          print(f"Endpoint: {endpoint}")
          
          try:
              s3.upload_file(
                  'tiktok.mp4',
                  bucket,
                  key,
                  ExtraArgs={'ACL': 'public-read'}
              )
              print("Upload successful!")
          except Exception as e:
              print(f"Upload failed: {e}")
              raise
          PYEOF
          
          python upload_to_r2.py
          
      # ─── CLEANUP ───
      - name: Cleanup
        if: always()
        run: rm -f final.mp4 tiktok.mp4 transcription.json tiktok_captions.ass
