name: YouTube Downloader

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID for tracking this download'
        required: false
        type: string
      yt_url:
        description: 'YouTube URL to download'
        required: true
        type: string
      start_time:
        description: 'Clip start time (optional, e.g. 00:00:10)'
        required: false
        type: string
      end_time:
        description: 'Clip end time (optional, e.g. 00:00:30)'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp (latest)
        run: pip install -U yt-dlp yt-dlp-ejs

      - name: Install Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO token provider
        run: |
          docker run -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3

      - name: Restore cookies
        run: echo "${{ secrets.YT_COOKIES_B64 }}" | base64 -d > cookies.txt

      - name: Validate cookies file
        run: |
          if [ ! -s cookies.txt ]; then
            echo "::error::cookies.txt is empty. Check that the YT_COOKIES_B64 secret is set and non-empty."
            exit 1
          fi

          if ! head -1 cookies.txt | grep -q "Netscape HTTP Cookie File"; then
            echo "::error::cookies.txt is not in Netscape format (missing '# Netscape HTTP Cookie File' header)."
            echo "Re-export cookies using a Netscape-format exporter (e.g. 'Get cookies.txt LOCALLY'),"
            echo "then base64-encode with: base64 -w0 cookies.txt   (Linux)  or  base64 -i cookies.txt -o out.txt  (macOS)"
            echo "and update the YT_COOKIES_B64 secret with the full output."
            exit 1
          fi

          cookie_lines=$(grep -vc '^#\|^$' cookies.txt || true)
          if [ "$cookie_lines" -lt 1 ]; then
            echo "::error::cookies.txt has the correct header but no actual cookie entries."
            exit 1
          fi

          echo "cookies.txt looks valid: Netscape header present, $cookie_lines cookie line(s) found."

      - name: Download video
        env:
          YT_COOKIES_FILE: cookies.txt
          VIDEO_URL: ${{ github.event.inputs.yt_url }}
          START_TIME: ${{ github.event.inputs.start_time }}
          END_TIME: ${{ github.event.inputs.end_time }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          echo "Job ID: ${JOB_ID:-none}"
          if [ -n "$START_TIME" ] && [ -n "$END_TIME" ]; then
            python scripts/download_youtube.py "$VIDEO_URL" "$START_TIME" "$END_TIME"
          else
            python scripts/download_youtube.py "$VIDEO_URL"
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.event.inputs.job_id || github.run_id }}
          path: final.mp4
