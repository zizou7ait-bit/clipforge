- name: Install yt-dlp (latest)
  run: pip install -U yt-dlp yt-dlp-ejs

- name: Start PO token provider
  run: |
    docker run -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
    sleep 3

- name: Restore cookies
  run: echo "${{ secrets.YT_COOKIES_B64 }}" | base64 -d > cookies.txt

- name: Download video
  env:
    YT_COOKIES_FILE: cookies.txt
  run: python scripts/download_youtube.py "https://www.youtube.com/watch?v=sDU_x5BQFas"
