name: YouTube Downloader
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID for tracking this download'
        required: false
        type: string
      yt_url:
        description: 'YouTube URL to download'
        required: true
        type: string
      start_time:
        description: 'Clip start time (optional, e.g. 00:00:10)'
        required: false
        type: string
      end_time:
        description: 'Clip end time (optional, e.g. 00:00:30)'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp (latest)
        run: pip install -U yt-dlp yt-dlp-ejs

      - name: Install Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO token provider
        run: |
          docker run -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3

      # Cookies are OPTIONAL. Works without them for most public videos.
      - name: Restore cookies (optional)
        run: |
          if [ -n "${{ secrets.YT_COOKIES_B64 }}" ]; then
            echo "${{ secrets.YT_COOKIES_B64 }}" | base64 -d > cookies.txt
            if [ -s cookies.txt ] && head -1 cookies.txt | grep -q "Netscape HTTP Cookie File"; then
              echo "Cookies loaded."
            else
              echo "::warning::Invalid cookies secret, continuing without cookies."
              rm -f cookies.txt
            fi
          else
            echo "::warning::No cookies set, continuing without them."
          fi

      - name: Download video
        id: download
        env:
          YT_COOKIES_FILE: cookies.txt
          VIDEO_URL: ${{ github.event.inputs.yt_url }}
          START_TIME: ${{ github.event.inputs.start_time }}
          END_TIME: ${{ github.event.inputs.end_time }}
        run: |
          if [ -n "$START_TIME" ] && [ -n "$END_TIME" ]; then
            python scripts/download_youtube.py "$VIDEO_URL" "$START_TIME" "$END_TIME"
          else
            python scripts/download_youtube.py "$VIDEO_URL"
          fi

      # Runs whether the download step above succeeded or failed, so the
      # dashboard always finds out what happened instead of a job hanging
      # forever in "processing".
      - name: Send result back to Hostinger
        if: always()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          UPLOAD_URL="${{ secrets.HOSTINGER_UPLOAD_URL }}"
          SECRET="${{ secrets.HOSTINGER_UPLOAD_SECRET }}"
          if [ -f final.mp4 ]; then
            echo "Uploading final.mp4 to Hostinger..."
            curl -sS -X POST "$UPLOAD_URL" \
              -H "X-Upload-Secret: $SECRET" \
              -F "job_id=${JOB_ID:-unknown}" \
              -F "video=@final.mp4"
          else
            echo "final.mp4 missing - reporting failure to dashboard."
            curl -sS -X POST "$UPLOAD_URL" \
              -H "X-Upload-Secret: $SECRET" \
              -F "job_id=${JOB_ID:-unknown}" \
              -F "status=failed" \
              -F "error_message=Download step failed or produced no output. Check the Actions log."
          fi
